dialog.about.rules=Tieni in gioco la palla con la racchetta e rompi ogni mattone per passare al livello successivo. Il punto in cui la palla tocca la racchetta ne decide l'angolo. I mattoni d'argento richiedono due colpi, quelli d'oro non si rompono mai. Frecce per muovere, Spazio per lanciare, P per la pausa, F11 per lo schermo intero.
