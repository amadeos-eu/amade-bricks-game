dialog.about.rules=Halten Sie den Ball mit dem Schläger im Spiel und zerschlagen Sie jeden Stein, um ins nächste Level zu kommen. Wo der Ball den Schläger trifft, bestimmt seinen Winkel. Silberne Steine brauchen zwei Treffer, goldene zerbrechen nie. Pfeiltasten bewegen, Leertaste spielt ab, P hält an, F11 schaltet ins Vollbild und zurück.
